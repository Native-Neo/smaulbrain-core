name: Publish to PyPI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist
      - name: Verify tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import smaulbrain; print(smaulbrain.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --no-deps dist/*.whl
          /tmp/wheel-smoke/bin/python -c "import smaulbrain; print('import ok', smaulbrain.__version__)"
          unzip -l dist/*.whl | grep -q "_ternary_kernels.cpp"
          unzip -l dist/*.whl | grep -q "_optimizer_kernels.cpp"
          unzip -l dist/*.whl | grep -q "kernels/cpu_kernels.cpp"
      - name: Run native ternary regression suite
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_ternary_update_kernels.py tests/test_quant_parity.py tests/test_ternary_chunks.py
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/smaulbrain-core
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
